<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>SARA — Smart Accessible Response Assistant | Tech-Quest 2.0</title>
    <meta name="description" content="Speak naturally. SARA understands. Making digital forms accessible, one conversation at a time." />
    <meta name="theme-color" content="#101B34" />
